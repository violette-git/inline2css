<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example 1: plain HTML (original)</title>
  <link rel="stylesheet" href="framework.css">
<link rel="stylesheet" href="output-semantic.css"></head>
<body>
  <div class="container">
    <header class="i2c-display-flex-0263">
      <h1 class="i2c-font-size-28px-52b8">Dashboard</h1>
      <span class="badge">beta</span>
    </header>

    <div class="grid md:flex md:gap">
      <div class="card">
        <p class="card-title">Revenue</p>
        <p class="card-body i2c-color-4b5563-fa62">Up and to the right, mostly.</p>
        <p class="i2c-margin-top-12px-a256">Updated moments ago</p>
      </div>

      <div class="card">
        <p class="card-title">Signups</p>
        <p class="card-body i2c-color-4b5563-fa62">A steady trickle of new folks.</p>
        <p class="i2c-margin-top-12px-a256">Updated moments ago</p>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Notes</p>
      <blockquote class="pull-quote i2c-margin-12px-0-d605">Ship it, then fix it.</blockquote>
      <p class="i2c-color-4b5563-fa62">Some inline text with the same styling as the card bodies above, on purpose, so you can see deduplication.</p>
      <div class="i2c-margin-top-16px-1b0f">
        <button class="btn btn-primary i2c-margin-right-8px-539f">Save</button>
        <button class="btn btn-ghost">Cancel</button>
      </div>
    </div>

    <p class="muted pulse i2c-text-align-center-1d05">Auto-refreshing…</p>
  </div>


</body></html>
