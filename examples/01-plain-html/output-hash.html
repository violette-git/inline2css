<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example 1: plain HTML (original)</title>
  <link rel="stylesheet" href="framework.css">
<link rel="stylesheet" href="output-hash.css"></head>
<body>
  <div class="container">
    <header class="i2c-0263ed">
      <h1 class="i2c-52b83d">Dashboard</h1>
      <span class="badge">beta</span>
    </header>

    <div class="grid md:flex md:gap">
      <div class="card">
        <p class="card-title">Revenue</p>
        <p class="card-body i2c-fa62b4">Up and to the right, mostly.</p>
        <p class="i2c-a25604">Updated moments ago</p>
      </div>

      <div class="card">
        <p class="card-title">Signups</p>
        <p class="card-body i2c-fa62b4">A steady trickle of new folks.</p>
        <p class="i2c-a25604">Updated moments ago</p>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Notes</p>
      <blockquote class="pull-quote i2c-d60550">Ship it, then fix it.</blockquote>
      <p class="i2c-fa62b4">Some inline text with the same styling as the card bodies above, on purpose, so you can see deduplication.</p>
      <div class="i2c-1b0f49">
        <button class="btn btn-primary i2c-539fa9">Save</button>
        <button class="btn btn-ghost">Cancel</button>
      </div>
    </div>

    <p class="muted pulse i2c-1d0566">Auto-refreshing…</p>
  </div>
