<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example 3: Tailwind 4 (original)</title><link rel="stylesheet" href="tailwind.css"></head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div class="mx-auto max-w-4xl p-6">
  <header class="mb-6 flex items-center justify-between"><h1 class="text-3xl font-bold tracking-tight" style="color:#312e81">Dashboard</h1>
  <span class="rounded-full bg-cyan-100 px-3 py-1 text-xs font-medium text-cyan-800">beta</span></header>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md">
      <p class="text-lg font-semibold">Revenue</p><p class="mt-1 text-slate-500">Up and to the right.</p>
      <div class="mt-4 space-y-2"><div class="h-2 w-2/3 rounded bg-indigo-500"></div><div class="h-2 w-1/3 rounded bg-indigo-300"></div></div></div>
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-lg font-semibold">Signups</p><p class="mt-1 text-slate-500" style="font-style:italic">A steady trickle.</p>
      <ul class="mt-3 divide-y divide-slate-100"><li class="py-2">Ada</li><li class="py-2">Lin</li><li class="py-2">Sam</li></ul></div>
  </div>
  <div class="mt-6 flex gap-3">
    <button class="rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 focus:outline-none">Save</button>
    <button class="rounded-lg border border-indigo-600 px-4 py-2 text-indigo-600 hover:bg-indigo-50 disabled:opacity-50" disabled>Cancel</button>
    <div class="ml-auto hidden sm:block w-[137px] p-[13px] text-center text-sm bg-amber-100 rounded-md">arbitrary</div>
  </div>
  <p class="mt-8 text-center text-sm text-slate-400 animate-pulse" style="margin-top:40px">Auto-refreshing&hellip;</p>
</div></body></html>
